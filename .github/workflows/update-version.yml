name: 更新 hugo 及依赖版本号

# 设置触发条件
on:
  # 定时检查(中国时间每天早4点, UTC 前一天20点; 早于镜像构建的5点)
  schedule:
    - cron: '0 20 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: 'update hugo & sass version'
        required: false
        default: 'manual check'

# 同一分支仅保留最新一次检查
concurrency:
  group: update-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 检查并更新版本号
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        # 稳定版过滤: 排除 rc/beta/alpha/dev 等预发布版本
        is_stable() {
          echo "$1" | grep -qivE '(rc|beta|alpha|test|dev|preview|snapshot|nightly|-pre)'
        }

        # 语义化版本比较: 若 $1 > $2 返回 0
        version_gt() {
          [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]
        }

        # 取 GitHub 仓库最新稳定 release(去掉前缀 v), 失败返回空
        gh_latest_stable() {
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/$1/releases?per_page=50" 2>/dev/null \
            | jq -r '.[] | select(.prerelease==false and .draft==false) | .tag_name' 2>/dev/null \
            | sed 's/^v//' \
            | while read -r t; do is_stable "$t" && echo "$t"; done \
            | grep -E '^[0-9]+(\.[0-9]+)+$' \
            | sort -V | tail -1 || true
        }

        DOCKERFILE=Dockerfile
        CHANGED=0
        SUMMARY=""

        # 通用更新函数: $1=ARG名 $2=最新版本
        try_update() {
          local arg="$1" latest="$2" current
          [ -z "$latest" ] && { echo "  [$arg] 获取最新版本失败, 跳过"; return; }
          current=$(grep -oP "^ARG ${arg}=\K.*" "$DOCKERFILE" | head -1 || true)
          [ -z "$current" ] && { echo "  [$arg] Dockerfile 中未找到, 跳过"; return; }
          if [ "$current" = "$latest" ]; then
            echo "  [$arg] 已是最新 ($current)"
          elif version_gt "$latest" "$current"; then
            echo "  [$arg] 更新: $current => $latest"
            sed -i "s|^ARG ${arg}=.*|ARG ${arg}=${latest}|" "$DOCKERFILE"
            CHANGED=1
            SUMMARY="${SUMMARY}\n- ${arg}: ${current} => ${latest}"
          else
            echo "  [$arg] 远程版本($latest)不高于当前($current), 跳过"
          fi
        }

        echo "===== 检查版本(仅稳定 release) ====="
        try_update HUGO_VERSION "$(gh_latest_stable gohugoio/hugo)"
        try_update SASS_VERSION "$(gh_latest_stable sass/dart-sass)"

        echo ""
        if [ "$CHANGED" = "1" ]; then
          echo "检测到版本更新:"
          echo -e "$SUMMARY"
          {
            echo "SUMMARY<<EOF"
            echo -e "$SUMMARY"
            echo "EOF"
            echo "CHANGED=1"
          } >> "$GITHUB_ENV"
        else
          echo "所有版本均为最新, 无需更新"
          echo "CHANGED=0" >> "$GITHUB_ENV"
        fi

    # 提交 Dockerfile 变更; 使用 GITHUB_TOKEN 推送不会触发 push 事件,
    # 因此显式 dispatch 构建工作流
    - name: 提交更新并触发构建
      if: env.CHANGED == '1'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Dockerfile
        git commit -m "chore: 自动更新 hugo 及依赖版本号$(echo -e "${SUMMARY}")"
        git push
        gh workflow run docker-publish.yml --ref "${GITHUB_REF_NAME}" -f build="build hugo"

    - name: 删除旧的GitHub-workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3    #保留多少个workflow不删除
